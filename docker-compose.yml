name: web2tgbot

x-base: &x-base
  image: bot
  restart: always
  environment:
    redis: "redis://redis:6379/"
    rabbitmq: "amqp://web2tg:bot@rabbitmq:5672/"
    db: "postgresql+asyncpg://web2tg:bot@database:5432/web2tg"
    bot_token: "${TOKEN}"
    reddit_username: "${REDDIT_USERNAME}"
    reddit_password: "${REDDIT_PASSWORD}"
  tmpfs:
    - /tmp
  volumes:
    - media:/media
  depends_on:
    - database
    - rabbitmq
    - redis

services:
  bot:
    build: .
    <<: *x-base
    command:
      - "bot.bot"

  reader:
    <<: *x-base
    command:
      - "bot.telegram_reader"

  messenger:
    <<: *x-base
    command:
      - "bot.telegram_messenger"

  reddit_scrapper:
    <<: *x-base
    command:
      - "bot.scrapper"
      - "reddit"
    volumes:
      - ./reddit_state.json:/app/state.json:rw

  instagram_scrapper:
    <<: *x-base
    command:
      - "bot.scrapper"
      - "instagram"

  database:
    image: postgres:14.2
    restart: always
    environment:
      POSTGRES_USER: web2tg
      POSTGRES_PASSWORD: bot
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database:/var/lib/postgresql/data

#  pgadmin:
#    image: dpage/pgadmin4:6
#    environment:
#      PGADMIN_DEFAULT_EMAIL: admin@admin.com
#      PGADMIN_DEFAULT_PASSWORD: admin
#    volumes:
#      - ./servers.json:/pgadmin4/servers.json:ro
#    ports:
#      - "8089:80"
#    depends_on:
#      - database

  redis:
    image: redis:7
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis:/data

  prometheus:
    image: prom/prometheus:v3.3.0
    restart: always
    volumes:
      - prometheus-persistence:/prometheus:rw
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
     - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana-oss:main
    restart: always
    volumes:
      - ./grafana_datasource_provision.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
      - grafana-storage:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

  rabbitmq:
    image: rabbitmq:3.10-management-alpine
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=web2tg
      - RABBITMQ_DEFAULT_PASS=bot
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq

volumes:
  database:
  redis:
  rabbitmq:
  prometheus-persistence:
  grafana-storage:
  media:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1G,uid=55555
